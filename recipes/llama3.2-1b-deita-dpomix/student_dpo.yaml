# Model arguments
model_name_or_path: /media/volume/h100_volumne3/Muon_optimizer/riskKD/models/stu_sft
torch_dtype: bfloat16

# Data training arguments
# For definitions, see: src/h4/training/config.py
dataset_mixer:
  pvdhihihi/ultra-feedback: 1.0 
dataset_splits:
- train
preprocessing_num_workers: 12

# DPOTrainer arguments
bf16: true
do_eval: false
gradient_accumulation_steps: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
learning_rate: 5.0e-7
log_level: info
logging_steps: 1
lr_scheduler_type: constant
max_length: 512
max_prompt_length: 256
num_train_epochs: 1
optim: adamw_torch
output_dir: /media/volume/h100_volumne3/Muon_optimizer/riskKD/models/stu_dpo
per_device_train_batch_size: 8
push_to_hub: false
save_strategy: "steps"
save_steps: 1000
save_only_model: true
seed: 42
warmup_ratio: 0.1
dataset_num_proc: 64
beta: 0.01

# DPO
sft_on_chosen: 0
dpo_weight: 1
distillation_weight: 0
chosen_distil_weight: 0
rejected_distil_weight: 0
adpa_weight: 0