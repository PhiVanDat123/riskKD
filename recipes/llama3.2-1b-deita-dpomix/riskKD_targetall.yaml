# riskKD target-all ablation: TVKD + Ra-DPO loss
# Model arguments
model_name_or_path: /home/minchan.kwon/ADPA/model/llama3.2-1b-deita-dpomix/student_sft_init
ref_model_name_or_path: /home/minchan.kwon/ADPA/model/llama3.2-1b-deita-dpomix/dpo_teacher_epoch1
torch_dtype: bfloat16

# Data training arguments
dataset_mixer:
  pvdhihihi/ultra-feedback: 1.0
dataset_splits:
- train
preprocessing_num_workers: 12

# DPOTrainer arguments
bf16: true
do_eval: false
gradient_accumulation_steps: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: False
learning_rate: 5.0e-7
log_level: info
logging_steps: 1
lr_scheduler_type: constant
max_length: 512
max_prompt_length: 256
num_train_epochs: 3
optim: adamw_torch
output_dir: /home/minchan.kwon/ADPA/model/llama3.2-1b-deita-dpomix/riskKD_output_tokenwt_targetall_mu_3ep
per_device_train_batch_size: 8
push_to_hub: false
save_strategy: "epoch"
save_only_model: true
seed: 42
warmup_ratio: 0.1
dataset_num_proc: 64
beta: 0.1

# DPO
sft_on_chosen: 0.0
sft_on_rejected: 0.0
dpo_weight: 0.0
distillation_weight: 0
chosen_distil_weight: 0
rejected_distil_weight: 0
adpa_weight: 0
qadapter_distil_weight: 0
qadapter_loss_type: "dpo"
kl_student_weight: 0.0
kl_student_target: "both"
precompute_ref_log_probs: false
reference_free: false
kl_penalty_weight: 0.0
force_use_ref_model: true
qadapter_alpha_tilde: 1.0
qadapter_alpha: 0.7
qadapter_alpha_1: 0.0
qadapter_softvalue_type: "entropy"

# Ra-DPO
radpo_weight: 1.0
radpo_alpha: 0.5
radpo_confidence_level: 0.5
if_radpo2: false
# Use full-vocab CVaR. The old split mode splits the vocab dimension in half, which is hard to justify for chosen/rejected risk.
is_split_risk_ratio: false
is_cal_risk_distribution_logps: false
radpo_keep_ref_model: true
# Anneal from near-expectation (0.99 keeps almost all mass under this code's convention) to median-tail risk.
radpo_mu_anneal_start: 0.99
radpo_mu_anneal_end: 0.5
radpo_mu_anneal_frac: 1.0
# Token-level weighting (kl_inv: w_t = exp(-alpha * per_position_KL_t), per-token KL ~0.5-5)
# alpha=1.0 => weight ~0.37 at KL_t=1, ~0.05 at a noisy KL_t=3 — attenuates cross-size noise tokens
radpo_token_weight_mode: kl_inv
radpo_token_weight_alpha: 1.0
# Normalize weights per sequence so weighting changes token emphasis, not total loss scale.
radpo_token_weight_normalize: true
# Apply weighting to both the utility gap u and the risk correction delta.
radpo_token_weight_target: all

#wandb
report_to: none
